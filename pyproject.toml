[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eso-reports"
version = "0.1.0"
description = "Automated ESO Suite Fire Incidents Report Generator"
authors = [{ name = "Reports Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "PyQt6>=6.6.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
eso-reports = "src.cli:main"
eso-reports-gui = "src.gui:launch_gui"

[tool.setuptools]
packages = ["src"]
