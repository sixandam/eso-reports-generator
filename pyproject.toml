[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eso-reports"
version = "0.1.0"
description = "Automated ESO Suite Fire Incidents Report Generator"
authors = [{ name = "ESO Reports Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "PyQt6>=6.6.0",
    "Pillow>=10.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
keywords = ["eso", "fire", "incident", "reports", "spreadsheet", "automation", "rms"]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-qt>=4.4.0",
]
build = [
    "pyinstaller>=6.0.0",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
eso-reports = "eso_reports.cli:main"
eso-reports-gui = "eso_reports.gui:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eso_reports = ["assets/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", ".dev/tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
